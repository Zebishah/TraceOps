name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: development
      INNGEST_DEV: "true"
      REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check lint
        run: uv run ruff check .

      - name: Check types
        run: uv run mypy

      - name: Run tests
        run: uv run pytest -q --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore

  training-smoke:
    name: Offline LoRA smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      INNGEST_DEV: "true"
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked backend test dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --group dev
      - name: Install isolated CPU training dependencies
        run: |
          uv pip install --python .venv/bin/python torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -r finetuning/requirements.txt
          uv run python -c "import torch, transformers, peft"
      - name: Train and reload a tiny local adapter without downloading a model
        run: uv run pytest -q tests/test_finetuning_training.py tests/test_classifier_worker.py
