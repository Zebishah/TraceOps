name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/lib/product/contracts.ts"
      - "frontend/components/workspace/incidents.tsx"
      - "frontend/components/workspace/intelligence.tsx"
      - "frontend/tests/classification-confidence.test.mts"
      - "frontend/lib/product/proxy-policy.ts"
      - "frontend/lib/product/voice-proxy.ts"
      - "frontend/lib/product/voice-contracts.ts"
      - "frontend/tests/voice-contracts.test.mts"
      - "frontend/app/api/backend/**"
      - "frontend/tests/voice-proxy.test.mts"
      - "frontend/tests/proxy-policy.test.ts"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/lib/product/contracts.ts"
      - "frontend/components/workspace/incidents.tsx"
      - "frontend/components/workspace/intelligence.tsx"
      - "frontend/tests/classification-confidence.test.mts"
      - "frontend/lib/product/proxy-policy.ts"
      - "frontend/lib/product/voice-proxy.ts"
      - "frontend/lib/product/voice-contracts.ts"
      - "frontend/tests/voice-contracts.test.mts"
      - "frontend/app/api/backend/**"
      - "frontend/tests/voice-proxy.test.mts"
      - "frontend/tests/proxy-policy.test.ts"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:
    inputs:
      verify_qwen:
        description: "Download pinned Qwen and run synthetic CPU training/serving verification"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: development
      INNGEST_DEV: "true"
      REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check lint
        run: uv run ruff check .

      - name: Check types
        run: uv run mypy && uv run mypy scripts/check_ai_readiness.py && uv run mypy finetuning/label_decoding.py

      - name: Run tests
        run: uv run pytest -q --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore

  training-smoke:
    name: Offline LoRA smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      INNGEST_DEV: "true"
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install uv
      - name: Install isolated locked CPU training dependencies
        run: |
          uv sync --project finetuning --frozen
          uv run --project finetuning --frozen python -c "import torch, transformers, peft, cryptography"
      - name: Train and reload a tiny local adapter without downloading a model
        run: uv run --project finetuning --frozen pytest -q tests/test_finetuning_training.py tests/test_classifier_worker.py tests/test_finetuning_quality.py tests/test_finetuning_artifacts.py tests/test_finetuning_process.py tests/test_signed_classifier_integration.py tests/test_finite_label_decoding.py

  confidence-contract:
    name: Frontend AI contracts and voice proxy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the bounded contract-test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/confidence-contract" --no-audit --no-fund zod@3.25.76 typescript@5.9.3 @types/node@22.19.19
          ln -s "$RUNNER_TEMP/confidence-contract/node_modules" frontend/node_modules
      - name: Check voice, confidence and proxy contracts
        run: node --experimental-strip-types --test frontend/tests/classification-confidence.test.mts frontend/tests/voice-proxy.test.mts frontend/tests/proxy-policy.test.ts frontend/tests/voice-contracts.test.mts

      - name: Check voice module types
        run: >-
          "$RUNNER_TEMP/confidence-contract/node_modules/.bin/tsc"
          --strict --noEmit --skipLibCheck --target ES2022 --module ESNext
          --moduleResolution bundler --allowImportingTsExtensions
          --typeRoots frontend/node_modules/@types --types node
          frontend/lib/product/voice-proxy.ts frontend/lib/product/voice-contracts.ts
          frontend/lib/product/proxy-policy.ts frontend/tests/voice-proxy.test.mts
          frontend/tests/voice-contracts.test.mts

  qwen-verification:
    name: Optional pinned Qwen CPU verification
    if: github.event_name == 'workflow_dispatch' && inputs.verify_qwen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the locked CPU environment
        run: |
          python -m pip install uv
          uv sync --project finetuning --frozen
      - name: Verify model training, reload, prediction and private HTTP serving
        run: uv run --project finetuning --frozen python -m finetuning.verify_qwen --output finetuning/runs/qwen-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-synthetic-verification
          path: backend/finetuning/runs/qwen-verification/verification.json
          if-no-files-found: ignore

  training-postgres:
    name: Training queue PostgreSQL concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: training
          POSTGRES_PASSWORD: training-fixture
          POSTGRES_DB: training_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U training -d training_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://training:training-fixture@127.0.0.1:5432/training_test
      TRAINING_TEST_DATABASE_URL: postgresql+psycopg://training:training-fixture@127.0.0.1:5432/training_test
      REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET_KEY: synthetic-ci-jwt-secret-key-at-least-32-characters
      AWS_ACCESS_KEY_ID: fixture
      AWS_SECRET_ACCESS_KEY: fixture
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: fixture
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: fixture
      MISTRAL_API_KEY: fixture
      VOYAGE_API_KEY: fixture
      GROQ_API_KEY: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --frozen --group dev
      - name: Apply the real migration chain
        run: uv run alembic upgrade head
      - name: Exercise concurrent admission and worker claims
        run: uv run pytest tests/integration/test_training_control_postgres.py -q
