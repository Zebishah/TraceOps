[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ops-pilot"
version = "0.1.0"
description = "Agentic incident investigation and resolution platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.103",
    "email-validator>=2.3.0",
    "fastapi",
    "groq==0.37.1",
    "httpx>=0.28.1",
    "langchain==1.4.2",
    "langchain-groq==1.1.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings",
    "pyjwt>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.103",
    "httpx",
    "mypy",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ops_pilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ops_pilot"]
